<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniture Products</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data/text.js"></script>
<script src="js/config/siteConfig.js"></script>
<script src="js/data/images.js"></script>
</head>
<body>

<header class="header">
    <div class="logo">
        <img id="siteLogo" decoding="async" alt="">
    </div>
    <nav>
        <a id="navHome" href="index.html"></a>
        <a id="navProducts" href="products.html"></a>
        <a id="navCollections" href="products.html"></a>
        <a id="navAbout" href="index.html#about"></a>
    </nav>
</header>

<section class="product-page">
    <h1 id="productsPageTitle"></h1>

    <div class="product-search">
        <input id="searchInput" class="search-input" type="search" autocomplete="off">
        <button id="searchButton" class="search-button" type="button"></button>
        <button id="clearSearch" class="search-clear" type="button"></button>
    </div>

    <div id="searchResultInfo" class="search-result-info"></div>
    <div id="recentProductNotice" class="recent-product-notice"></div>

    <button id="mobileCategoryToggle" class="mobile-category-toggle" type="button">
        <span id="mobileCategoryText"></span>
        <span id="mobileCategoryArrow" class="mobile-category-arrow">⌄</span>
    </button>

    <div class="product-container">
        <div class="category-menu" id="categoryMenu"></div>
        <div class="product-list" id="productList"></div>
    </div>
</section>

<footer class="site-footer">
    <div class="footer-inner">
        <span id="footerCopyright"></span>
        <a id="footerWhatsApp" target="_blank" rel="noopener noreferrer"></a>
    </div>
</footer>

<script>
// Shared UI copy / logo config only; page behavior lives in main.js.
document.getElementById("siteLogo").src = siteImages.logo.src;
document.getElementById("siteLogo").alt = siteImages.logo.alt;

document.getElementById("navHome").textContent = siteText.nav.home;
document.getElementById("navProducts").textContent = siteText.nav.products;
document.getElementById("navCollections").textContent = siteText.nav.collections;
document.getElementById("navAbout").textContent = siteText.nav.about;

document.getElementById("productsPageTitle").textContent = siteText.products.pageTitle;
document.getElementById("searchInput").placeholder = siteText.products.searchPlaceholder;
document.getElementById("searchButton").textContent = siteText.products.searchButton;
document.getElementById("clearSearch").textContent = siteText.products.clearButton;
document.getElementById("mobileCategoryText").textContent = siteText.products.categories;
document.getElementById("footerCopyright").textContent = siteText.footer.copyright;
document.getElementById("footerWhatsApp").textContent = siteText.footer.whatsapp;
document.getElementById("footerWhatsApp").href = "https://wa.me/" + siteText.whatsapp.number;
</script>

<script src="js/data/categories.js"></script>
<script src="js/data/products.js"></script>
<script src="js/main.js"></script>

</body>
</html>
